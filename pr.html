<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Katalog Produk | extraordinary.you</title>
    
    <link rel="stylesheet" href="style.css"> 
    
<link href="https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@0,400..900;1,400..900&family=Poppins:wght@300;400;600&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css">
</head>
<body>

    <header class="main-header sticky-header">
          <a href="index.html" class="logo-link">
        <h1 class="logo">ordinary.u</h1>
        </a>
         <form class="search-form" action="pr.html" method="GET">
            <input type="text" name="q" placeholder="Cari produk..." class="search-input">
            <button type="submit" class="search-btn"><i class="fa-solid fa-magnifying-glass"></i></button>
        </form>
 <nav class="main-nav">
            <ul class="nav-list" style="display: flex; align-items: center; gap: 20px; list-style: none;">
                <li>
                    <a href="kart.html" id="cart-link" class="nav-link">
                        <i class="fa-solid fa-bag-shopping nav-icon"></i>
                        <span id="cart-count">0</span>
                    </a>
                </li>
                <li>
                    <a href="profile.html" id="profile-link" class="nav-link" style="display: flex; align-items: center;">
                        <div id="nav-avatar-container" style="width: 30px; height: 30px; border-radius: 50%; background: #eaeaea; display: flex; align-items: center; justify-content: center; overflow: hidden; border: 1px solid #333;">
                            <i id="nav-avatar-icon" class="fa-solid fa-user" style="font-size: 14px; color: #333;"></i>
                            <img id="nav-avatar-img" src="" alt="Profile" style="display: none; width: 100%; height: 100%; object-fit: cover;">
                        </div>
                    </a>
                </li>
            </ul>
        </nav>
    </header>

    <main class="content-wrapper"> 
        
        <section class="catalog-header container section-gap">
            <h2 class="classy-heading">Katalog Koleksi</h2>
            <p class="intro-text">Telusuri seluruh koleksi kami yang elegan dan berkualitas tinggi.</p>
            
            <div class="filter-bar">
                <label for="category-filter">Filter:</label>
                <select id="category-filter">
                    <option value="all">Semua Kategori</option>
                    <option value="pakaian">Pakaian</option>
                    <option value="aksesoris">Aksesoris</option>
                    <option value="gaya hidup">Gaya hidup</option>
                    <option value="barang">Barang</option>
                    <option value="trending">Trending</option>
                </select>
            </div>
        </section>
        
        <section id="full-product-catalog" class="product-grid container"> 
            <p style="text-align: center; grid-column: 1 / -1;">Memuat produk...</p>
        </section>
        
    </main>
    
    <footer class="main-footer">
        <p>Extraordinary.co &copy; 2025</p>
    </footer>

    <script src="script.js"></script>
</body>
</html>
